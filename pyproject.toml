[project]
name = "textovervoice"
version = "0.1.0"
description = "Text transport over voice-grade audio channels (phone calls)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "reedsolo",
]

[project.optional-dependencies]
dev = ["pytest"]
acoustic-test = ["sounddevice"]  # tools/codec_validation/acoustic_loopback_test.py

[project.scripts]
textovervoice = "textovervoice.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
